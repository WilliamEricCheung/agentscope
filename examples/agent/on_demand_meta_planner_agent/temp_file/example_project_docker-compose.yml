version: '3.8'
services:
  research-app:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "8888:8888"
    environment:
      - PYTHONPATH=/app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: