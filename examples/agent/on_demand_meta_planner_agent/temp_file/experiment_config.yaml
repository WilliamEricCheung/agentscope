# 实验配置文件示例

# 通用设置
general:
  seed: 42
  device: "cuda"  # or "cpu"
  output_dir: "./results"
  log_level: "INFO"

# LLM核心配置
llm:
  model_name: "meta-llama/Llama-2-7b-chat-hf"  # 可替换为其他模型
  temperature: 0.1
  max_tokens: 2048
  top_p: 0.9
  api_key: "${OPENAI_API_KEY}"  # 从环境变量读取

# 工具配置
tools:
  calculator:
    enabled: true
    description: "执行数学计算的工具"
    timeout: 10
    
  search:
    enabled: true
    description: "执行网络搜索的工具"
    engine: "duckduckgo"  # or "google", "bing"
    timeout: 30
    
  wikipedia:
    enabled: true
    description: "查询Wikipedia知识的工具"
    timeout: 20
    
  translation:
    enabled: true
    description: "文本翻译工具"
    supported_languages: ["en", "zh", "fr", "de", "es"]
    timeout: 15
    
  code_executor:
    enabled: true
    description: "安全的代码执行环境"
    timeout: 30
    sandboxed: true

# 实验特定配置
experiments:
  toolformer:
    dataset: "toolformer_synthetic"
    num_examples: 1000
    evaluation_metrics: ["tool_call_accuracy", "task_completion_rate"]
    
  hugginggpt:
    model_pool_size: 10
    task_types: ["image_understanding", "speech_recognition", "text_generation"]
    evaluation_metrics: ["task_decomposition_accuracy", "model_selection_accuracy"]
    
  react:
    environments: ["wikipedia", "math_solver"]
    datasets: ["hotpotqa", "scienceqa", "gsm8k"]
    evaluation_metrics: ["reasoning_correctness", "action_effectiveness"]
    
  tool_llm:
    tool_library_size: 50
    learning_strategies: ["zero_shot", "few_shot", "finetuning"]
    evaluation_metrics: ["tool_understanding", "tool_composition", "generalization"]
    
  agentbench:
    benchmark_environments: 8
    task_categories: ["os_interaction", "database_query", "web_navigation", "games"]
    evaluation_metrics: ["agentbench_official", "custom_metrics"]

# 评估配置
evaluation:
  num_trials: 3
  timeout_per_task: 60
  save_intermediate_results: true
  generate_reports: true